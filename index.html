<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharp Eleven</title>
  <meta name="description" content="All-in-one jazz practice app.">
  <link rel="icon" href="./favicons/favicon.ico" sizes="any">
  <link rel="icon" href="./favicons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="./favicons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicons/favicon-48x48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="./favicons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="./favicons/site.webmanifest">
  <meta name="theme-color" content="#f5f1e6">
  <style>
    :root {
      --c-bg: #f5f1e6;
      --c-text: #1a1a1a;
      --c-accent: #c19a6b;
      --c-secondary: #dcd6c8;
      --c-text-muted: color-mix(in srgb, var(--c-text) 68%, var(--c-bg) 32%);
      --c-border: color-mix(in srgb, var(--c-text) 24%, var(--c-bg) 76%);
      --c-control-bg: color-mix(in srgb, var(--c-secondary) 45%, transparent 55%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--c-bg);
      color: var(--c-text);
    }

    .page {
      min-height: 100vh;
      padding: 28px 34px 38px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(20px, 3vw, 38px);
    }

    .topbar,
    .brand {
      display: flex;
      align-items: center;
    }

    .topbar {
      width: min(1180px, 100%);
      margin: 0 auto;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      min-width: 0;
      color: var(--c-text);
      text-decoration: none;
    }

    .brand img {
      width: min(280px, 32vw);
      height: auto;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .button,
    button {
      min-height: 40px;
      border: 1px solid var(--c-border);
      border-radius: 999px;
      padding: 0 18px;
      background: var(--c-control-bg);
      color: var(--c-text);
      font: inherit;
      font-weight: 760;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--c-accent);
      background: var(--c-accent);
      color: var(--c-text);
      min-height: 52px;
      border-radius: 9px;
      padding: 0 28px;
      font-size: 1.02rem;
      font-weight: 850;
      box-shadow: 0 14px 32px color-mix(in srgb, var(--c-text) 12%, transparent 88%);
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(360px, 1fr);
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding-bottom: clamp(20px, 6vh, 76px);
      transform: translateY(-12px);
    }

    .hero-mark {
      transform: translate(-16px, -44px);
    }

    .hero-mark img {
      width: clamp(340px, 43vw, 560px);
      max-width: none;
      height: auto;
      display: block;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 58%, transparent 78%);
      mask-image: radial-gradient(ellipse at center, #000 58%, transparent 78%);
      filter: drop-shadow(0 18px 24px color-mix(in srgb, var(--c-text) 8%, transparent 92%));
    }

    .hero-copy {
      max-width: 560px;
    }

    .hero-mobile-logo {
      display: none;
    }

    .hero-copy > * + * {
      margin-top: 0;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.5rem, 6.5vw, 5.4rem);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .hero-rule {
      width: 72px;
      height: 3px;
      margin: 32px 0 26px;
      background: var(--c-accent);
    }

    p {
      max-width: 520px;
      margin: 0;
      color: var(--c-text-muted);
      font-size: clamp(1.12rem, 2vw, 1.42rem);
      line-height: 1.55;
    }

    .hero-cta {
      display: flex;
      width: fit-content;
      margin-top: 42px;
    }

    @media (max-width: 880px) and (min-width: 761px) {
      .hero-mark {
        transform: translate(-8px, -42px);
      }

      .hero-mark img {
        width: min(38vw, 330px);
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 22px;
        grid-template-rows: minmax(0, 1fr);
      }

      .topbar {
        display: none;
      }

      main {
        min-height: calc(100vh - 44px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding-bottom: 0;
        text-align: center;
        transform: none;
      }

      .hero-mark {
        transform: none;
      }

      .hero-mark img {
        display: none;
      }

      .hero-mobile-logo {
        display: block;
        width: min(64vw, 218px);
        height: auto;
        margin: 0 auto -4px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 62%, transparent 82%);
        mask-image: radial-gradient(ellipse at center, #000 62%, transparent 82%);
      }

      .hero-copy {
        max-width: 390px;
      }

      h1 {
        max-width: 14.8ch;
        font-size: clamp(2.4rem, 11.5vw, 3.38rem);
        line-height: 1;
        margin: 0 auto;
      }

      .hero-rule {
        margin: 26px auto 24px;
      }

      p {
        font-size: 1.06rem;
        line-height: 1.5;
        margin: 0 auto;
      }

      .hero-cta {
        width: min(100%, 320px);
        min-height: 56px;
        margin: 38px auto 0;
        padding: 0 20px;
        font-weight: 800;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Sharp Eleven home">
        <img src="./logo/brand-lockup-horizontal.png" alt="Sharp Eleven App" width="2172" height="724">
      </a>
    </header>

    <main>
      <div class="hero-mark" aria-hidden="true">
        <img src="./logo/brand-symbol.png" alt="" width="1254" height="1254">
      </div>
      <section class="hero-copy" aria-labelledby="hero-title">
        <img class="hero-mobile-logo" src="./logo/brand-lockup-vertical.png" alt="Sharp Eleven App" width="1122" height="1402">
        <h1 id="hero-title">All-in-one jazz practice app.</h1>
        <div class="hero-rule" aria-hidden="true"></div>
        <p>Create, import, and share charts. Play them with a virtual band, practice drills in every key, and keep your song library organized.</p>
        <a class="button primary hero-cta" href="./chart-editor.html">Try the GPT-assisted chart editor</a>
      </section>
    </main>
  </div>

</body>
</html>
