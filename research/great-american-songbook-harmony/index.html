<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research - Under construction - Sharp Eleven</title>
  <meta name="description" content="Our page on recurring harmonic progressions is under construction.">
  <link rel="icon" href="../../favicons/favicon.ico" sizes="any">
  <link rel="icon" href="../../favicons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="../../favicons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="../../favicons/favicon-48x48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="../../favicons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="../../favicons/site.webmanifest">
  <meta name="theme-color" content="#f5f1e6">
  <link rel="stylesheet" href="../../theme.css">
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ui-bg);
      color: var(--ui-text);
    }

    a {
      color: var(--ui-accent-strong);
    }

    .page {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: clamp(36px, 7vw, 72px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ui-text);
      font-weight: 760;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .topbar-link {
      color: var(--ui-text-muted);
      font-size: 0.94rem;
      text-decoration: none;
    }

    main {
      display: grid;
      gap: clamp(28px, 5vw, 48px);
    }

    .article-header {
      display: grid;
      gap: 18px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--ui-border);
    }

    .eyebrow {
      margin: 0;
      color: var(--ui-accent-cool);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .dek {
      max-width: 760px;
      margin: 0;
      color: var(--ui-text-muted);
      font-size: clamp(1.12rem, 2.4vw, 1.36rem);
      line-height: 1.58;
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding-top: 4px;
    }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid var(--ui-accent);
      border-radius: 8px;
      background: var(--ui-accent);
      color: var(--ui-bg);
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--ui-control-shadow);
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 28px, 980px);
        padding-top: 20px;
      }

      .topbar {
        align-items: flex-start;
      }

    }

  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="Sharp Eleven home">
        <img class="brand-logo" src="../../logo/classic-paper.png" alt="" width="256" height="256">
        <span>Sharp Eleven</span>
      </a>
      <a class="topbar-link" href="../../">Home</a>
    </header>

    <main>
      <header class="article-header">
        <p class="eyebrow">Research</p>
        <h1>Under construction</h1>
        <p class="dek">Our page on recurring harmonic progressions is being prepared. Please check back later.</p>
      </header>
      <div class="cta">
        <a class="button" href="../../">Back to home</a>
      </div>
    </main>
  </div>
</body>
</html>
